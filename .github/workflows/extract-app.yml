name: Extract uploaded app files

on:
  push:
    branches: [main]
    paths:
      - 'nesiye-app.zip'
      - '.github/workflows/extract-app.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Extract app files
        run: |
          unzip -o nesiye-app.zip -d .
          rm -f "nesiye-app.zip"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add extracted Nesiye app files" || exit 0
          git push origin HEAD:main
